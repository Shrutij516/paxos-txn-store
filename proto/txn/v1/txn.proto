// Sharded transactions. The Txn service is the client API; the messages
// under "Two-phase commit" travel between nodes inside the peer service's
// Envelope (proto/paxos/v1). internal/wire converts those to and from the
// structs in internal/txn.
syntax = "proto3";

package txn.v1;

option go_package = "github.com/Shrutij516/paxos-txn-store/proto/txn/v1;txnv1";

// TxnMeta identifies one attempt of a transaction. ts is its start
// timestamp for wound-wait (smaller is older); a retry keeps it.
message TxnMeta {
  uint64 id = 1;
  uint64 ts = 2;
}

// Part is one shard's share of a transaction: the versions it read and
// the values it writes.
message Part {
  uint32 shard = 1;
  map<string, uint64> reads = 2;
  map<string, string> writes = 3;
}

// ---- Two-phase commit (node to node) ----

message PrepareReq {
  TxnMeta txn = 1;
  uint32 coord = 2;
  repeated uint32 participants = 3;
  Part part = 4;
}

message Vote {
  uint64 txn = 1;
  uint32 shard = 2;
  bool yes = 3;
}

message Decision {
  uint64 txn = 1;
  bool commit = 2;
}

message QueryOutcome {
  uint64 txn = 1;
  uint32 from = 2;
  repeated uint32 participants = 3;
}

message WoundReq {
  uint64 txn = 1;
}

// ---- Client API ----

enum Status {
  STATUS_UNSPECIFIED = 0;
  // Done. For Commit: the transaction committed.
  STATUS_OK = 1;
  // The transaction was aborted (wounded, a lock or read became stale, or
  // the commit decision was abort). Start a new attempt.
  STATUS_ABORTED = 2;
  // This node does not lead the shard; leader names the one it knows of.
  STATUS_NOT_LEADER = 3;
}

// LeaderHint names a shard's leader as far as the answering node knows
// (id 0 and an empty addr if it knows of none).
message LeaderHint {
  int32 id = 1;
  string addr = 2;
}

// Begin starts a transaction attempt. Any node answers.
message BeginRequest {
  // Non-zero keeps the start timestamp of an earlier, aborted attempt, so
  // a retried transaction ages and eventually wins under wound-wait.
  uint64 ts = 1;
}

message BeginResponse {
  TxnMeta txn = 1;
  // Number of shards; keys map to shards by FNV-1a hash modulo this.
  uint32 shards = 2;
}

// Read goes to the leader of the key's shard. It takes a shared lock and
// returns the committed value and its version.
message ReadRequest {
  TxnMeta txn = 1;
  string key = 2;
}

message ReadResponse {
  Status status = 1;
  string value = 2;
  uint64 version = 3;
  LeaderHint leader = 4;
}

// Write goes to the leader of the key's shard before commit. It renews
// the transaction's locks there and fails fast if the transaction is
// already doomed. The value is buffered by the client and sent in Commit;
// write locks are taken at prepare.
message WriteRequest {
  TxnMeta txn = 1;
  string key = 2;
}

message WriteResponse {
  Status status = 1;
  LeaderHint leader = 2;
}

// Commit goes to the leader of the coordinator shard, the lowest shard in
// parts. One part commits in one phase; more use two-phase commit. Commit
// is idempotent per txn id: after a timeout or a lost connection the
// outcome is unknown and the client retries the same request.
message CommitRequest {
  TxnMeta txn = 1;
  repeated Part parts = 2;
}

message CommitResponse {
  Status status = 1;
  LeaderHint leader = 2;
}

// Abort releases the transaction's shared locks at one shard's leader.
// It is a hint: abandoned locks also expire.
message AbortRequest {
  uint64 txn = 1;
  uint32 shard = 2;
}

message AbortResponse {
  Status status = 1;
  LeaderHint leader = 2;
}

service Txn {
  rpc Begin(BeginRequest) returns (BeginResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);
}
