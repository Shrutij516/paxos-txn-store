# The local stack: three paxosd nodes (each hosting one replica of each of
# the three shards), Prometheus, Grafana with the committed dashboard, and
# Jaeger receiving the nodes' traces over OTLP. From the repository root:
#
#   docker compose -f deploy/compose.yaml up -d --build --wait
#
# Grafana http://localhost:3000, Jaeger http://localhost:16686,
# Prometheus http://localhost:9090; the nodes serve gRPC on 7001 to 7003
# and metrics on 9101 to 9103 (docs/running.md). Third-party images come
# from mirror.gcr.io to avoid Docker Hub rate limits.
name: paxos

x-node: &node
  image: ${PAXOSD_IMAGE:-paxos-txn-store:dev}
  build:
    context: ..
  restart: "no" # the chaos runner restarts killed nodes itself
  stop_signal: SIGTERM
  stop_grace_period: 15s
  healthcheck:
    # Ready: every shard on the node has a known leader and has applied
    # everything it knows to be committed. The image has no shell, so
    # paxosd probes itself.
    test: ["CMD", "/paxosd", "-probe", "http://127.0.0.1:9100/readyz"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  node1:
    <<: *node
    command: ["-id=1", "-config=/etc/paxosd/cluster.json", "-listen=0.0.0.0:7001", "-data-dir=/data", "-metrics-listen=0.0.0.0:9100", "-otlp-endpoint=jaeger:4317", "-trace-sample=0.1"]
    volumes:
      - ./cluster.json:/etc/paxosd/cluster.json:ro
      - node1-data:/data
    ports: ["127.0.0.1:7001:7001", "127.0.0.1:9101:9100"]
  node2:
    <<: *node
    command: ["-id=2", "-config=/etc/paxosd/cluster.json", "-listen=0.0.0.0:7001", "-data-dir=/data", "-metrics-listen=0.0.0.0:9100", "-otlp-endpoint=jaeger:4317", "-trace-sample=0.1"]
    volumes:
      - ./cluster.json:/etc/paxosd/cluster.json:ro
      - node2-data:/data
    ports: ["127.0.0.1:7002:7001", "127.0.0.1:9102:9100"]
  node3:
    <<: *node
    command: ["-id=3", "-config=/etc/paxosd/cluster.json", "-listen=0.0.0.0:7001", "-data-dir=/data", "-metrics-listen=0.0.0.0:9100", "-otlp-endpoint=jaeger:4317", "-trace-sample=0.1"]
    volumes:
      - ./cluster.json:/etc/paxosd/cluster.json:ro
      - node3-data:/data
    ports: ["127.0.0.1:7003:7001", "127.0.0.1:9103:9100"]

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus/compose.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: mirror.gcr.io/grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/paxos-txn-store.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/paxos-txn-store.json:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: mirror.gcr.io/jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]
    stop_grace_period: 10s

volumes:
  node1-data:
  node2-data:
  node3-data:
