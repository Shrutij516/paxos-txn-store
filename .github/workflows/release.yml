name: release

# On every push to main (a merged PR), publish the paxosd image to the
# GitHub Container Registry, tagged with the commit SHA (DECISIONS.md
# entry 32).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push ghcr.io/<owner>/paxos-txn-store:<sha>
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
          docker push "$image"
          echo "pushed $image" >> "$GITHUB_STEP_SUMMARY"
