name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Five jobs run in parallel: lint, sdk-deps (the SDK imports no internal
# package), proto (generated code is up to date), race-short and full. The race detector slows the seeded simulation
# suites about 9x, so it runs on the short seed counts, while the full 1000
# seed suites run once without -race and also feed the coverage gate.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  # The public SDK must not depend on this module's internal packages,
  # which programs outside the module cannot import.
  sdk-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: client imports no internal package
        run: make sdk-check

  # Regenerates the protobuf code with pinned tools and fails if the
  # committed files differ from what the .proto files produce.
  proto:
    runs-on: ubuntu-latest
    env:
      PROTOC_VERSION: "29.3"
      PROTOC_GEN_GO_VERSION: v1.36.6
      PROTOC_GEN_GO_GRPC_VERSION: v1.5.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install protoc and plugins
        run: |
          curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          protoc --version

      - name: regenerate and compare
        run: make proto-check

  race-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test -race -short
        run: go test -race -short ./...

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test (1000 seeds) and coverage gate (internal/paxos >= 85%)
        run: make cover
