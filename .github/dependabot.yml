# Dependency and toolchain bumps arrive as pull requests, so they run
# through CI (including govulncheck and chaos) before they reach main.
#
# Minor and patch updates are grouped into one pull request per entry
# below. Major updates are left out of the groups, so each one arrives as
# its own pull request and can be reviewed (and its changelog read) alone.
version: 2
updates:
  # Go modules, including the go directive in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images in the Dockerfile (Go builder, distroless runtime).
  # The Go builder only gets patch bumps: moving to a new Go line is a
  # deliberate change made together with go.mod (DECISIONS.md entry 38).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "library/golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]

  # Images of the local stack (Prometheus, Grafana, Jaeger).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: [minor, patch]
